<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSMapper v1.0.0</title>

    <link rel="stylesheet" href="./app.css">

    <script src="js/lodash.min.js"></script>
    <script src="js/backbone-min.js"></script>
    <script src="js/joint.js"></script>

    <style>
        /* ── LOCAL OFFLINE FONT INJECTIONS ── */
        @font-face {
            font-family: 'Inter';
            src: url('fonts/inter-v20-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Inter';
            src: url('fonts/inter-v20-latin-600.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'JetBrains Mono';
            src: url('fonts/jetbrains-mono-v24-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        :root {
            --vsm-menubar: #1A1D24;
            --vsm-toolbar: #20242C;
            --vsm-panel: #FFFFFF;
            --vsm-toolbar-active: #F59E0B;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="w-screen h-screen flex flex-col overflow-hidden bg-[#F4F5F7]">

    <header class="flex items-center h-12 shrink-0 select-none z-50 text-[#9CA3AF]"
        style="background: var(--vsm-menubar); border-bottom: 1px solid rgba(255,255,255,0.06);">
        <div class="flex items-center gap-2 px-4 shrink-0 h-full"
            style="border-right: 1px solid rgba(255,255,255,0.08);">
            <div class="flex items-center justify-center w-7 h-7 rounded bg-[#F59E0B]">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1C1E26" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </div>
            <span class="text-[#E8E9ED] text-[13px] font-600 tracking-tight">VSMapper</span>
        </div>

        <nav class="flex items-center h-full" style="border-right: 1px solid rgba(255,255,255,0.08);">
            <div class="relative h-full flex items-center dropdown-parent">
                <button
                    class="px-3 h-full text-[13px] hover:text-[#F59E0B] hover:bg-[rgba(245,158,11,0.08)] transition-colors">File</button>
                <div
                    class="absolute top-full left-0 py-1 rounded-md shadow-2xl hidden bg-[#1C1E26] border border-[rgba(255,255,255,0.1)] min-w-44 text-[13px] text-[#C9CAD1]">
                    <button
                        class="w-full text-left px-4 py-1.5 hover:bg-[rgba(245,158,11,0.12)] hover:text-[#F59E0B]">New
                        Map</button>
                    <button
                        class="w-full text-left px-4 py-1.5 hover:bg-[rgba(245,158,11,0.12)] hover:text-[#F59E0B]">Open...</button>
                    <div class="h-[1px] bg-[rgba(255,255,255,0.07)] my-1"></div>
                    <button
                        class="w-full text-left px-4 py-1.5 hover:bg-[rgba(245,158,11,0.12)] hover:text-[#F59E0B]">Save</button>
                    <button
                        class="w-full text-left px-4 py-1.5 hover:bg-[rgba(245,158,11,0.12)] hover:text-[#F59E0B]">Export
                        as SVG</button>
                </div>
            </div>
            <div class="relative h-full flex items-center dropdown-parent">
                <button
                    class="px-3 h-full text-[13px] hover:text-[#F59E0B] hover:bg-[rgba(245,158,11,0.08)] transition-colors">Edit</button>
            </div>
            <div class="relative h-full flex items-center dropdown-parent">
                <button
                    class="px-3 h-full text-[13px] hover:text-[#F59E0B] hover:bg-[rgba(245,158,11,0.08)] transition-colors">Process</button>
            </div>
        </nav>

        <div class="flex-1 flex items-center justify-center px-4">
            <div id="title-container"
                class="flex items-center gap-2 rounded px-2 py-0.5 hover:bg-[rgba(255,255,255,0.06)] text-[#C9CAD1] text-[13px] font-500 cursor-pointer">
                <span id="title-text">Current State Map — Widget Factory</span>
            </div>
        </div>

        <div class="flex items-center gap-1 px-3 shrink-0">
            <button id="btn-zoom-out"
                class="w-7 h-7 flex items-center justify-center rounded hover:bg-[rgba(255,255,255,0.08)] hover:text-[#E8E9ED]"><svg
                    width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg></button>
            <select id="zoom-select"
                class="rounded px-1 py-0.5 text-center bg-[rgba(255,255,255,0.07)] text-[#C9CAD1] mono text-xs border border-[rgba(255,255,255,0.1)] outline-none w-18 cursor-pointer">
                <option value="50">50%</option>
                <option value="75">75%</option>
                <option value="100" selected>100%</option>
                <option value="125">125%</option>
                <option value="150">150%</option>
            </select>
            <button id="btn-zoom-in"
                class="w-7 h-7 flex items-center justify-center rounded hover:bg-[rgba(255,255,255,0.08)] hover:text-[#E8E9ED]"><svg
                    width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg></button>
            <div class="w-[1px] h-5 bg-[rgba(255,255,255,0.08)] mx-1"></div>
            <button
                class="flex items-center gap-2 rounded bg-[#F59E0B] text-[#1C1E26] px-3 py-1.5 text-xs font-600 hover:bg-[#FBBF24] transition-colors">Share</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <aside class="flex flex-col h-full shrink-0 overflow-y-auto no-scrollbar py-2 text-[#6B7280]"
            style="width: 56px; background: var(--vsm-toolbar); border-right: 1px solid rgba(255,255,255,0.06);">
            <div class="flex flex-col items-center gap-1 w-full" id="tools-container">
                <button
                    class="w-10 h-9 flex items-center justify-center rounded bg-[#F59E0B] text-[#1C1E26] shadow-md"><svg
                        width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                        <path d="m13 13 6 6"></path>
                    </svg></button>
                <button class="w-10 h-9 flex items-center justify-center rounded hover:text-[#E8E9ED]"><svg width="18"
                        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"></path>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4.5"></path>
                        <path d="M18 10.5V12A7 7 0 0 1 4 12v-1.5"></path>
                    </svg></button>
                <div class="w-9 h-[1px] bg-[rgba(255,255,255,0.06)] my-1"></div>
                <button class="w-10 h-9 flex items-center justify-center rounded hover:text-[#E8E9ED]"
                    title="Process Box"><svg width="20" height="18" viewBox="0 0 20 18" fill="none">
                        <rect x="1.5" y="1.5" width="17" height="15" rx="1" stroke="currentColor" stroke-width="1.6" />
                    </svg></button>
                <button class="w-10 h-9 flex items-center justify-center rounded hover:text-[#E8E9ED]"
                    title="Inventory Triangle"><svg width="20" height="18" viewBox="0 0 20 18" fill="none">
                        <path d="M10 3L18.5 15.5H1.5L10 3Z" stroke="currentColor" stroke-width="1.6"
                            stroke-linejoin="round" />
                    </svg></button>
            </div>
        </aside>

        <main class="flex-1 relative overflow-hidden bg-[#F4F5F7]">
            <div id="vsm-paper-container" class="w-full h-full"></div>

            <div class="absolute bottom-12 left-14 right-14 pointer-events-none bg-transparent">
                <div class="flex items-end h-[52px]" id="timeline-ladder-bar">
                </div>
                <div
                    class="absolute bottom-[-18px] left-0 right-0 mono text-[10px] text-[#9CA3AF] flex justify-between">
                    <span>Lead Time: <span id="summary-lead-time">12.4 days</span></span>
                    <span class="text-[#16A34A]">VA Time: <span id="summary-va-time">265s</span></span>
                </div>
            </div>

            <div
                class="absolute bottom-4 right-4 rounded-lg px-3 py-2 bg-[rgba(28,30,38,0.88)] border border-[rgba(255,255,255,0.1)] backdrop-blur-[4px] mono text-[11px] text-[#6B7280]">
                <div class="text-[#9CA3AF] mb-0.5">Canvas — JointJS Core</div>
                <div id="badge-counters">4 processes · 4 inventories</div>
                <div class="text-[#F59E0B] mt-0.5">VA Efficiency: 0.024%</div>
            </div>
        </main>
    </div>

    <footer id="bottom-panel" class="flex flex-col bg-white shrink-0 overflow-hidden"
        style="border-top: 1px solid rgba(0,0,0,0.1); height: 240px; transition: height 0.22s ease;">
        <div id="panel-handle" class="flex items-center justify-between px-3 cursor-pointer shrink-0 h-9 bg-[#F9FAFB]"
            style="border-bottom: 1px solid rgba(0,0,0,0.07);">
            <div class="flex items-center gap-1 h-full" id="tab-button-group">
                <button data-tab="process"
                    class="px-3 h-full flex items-center text-[12px] font-600 text-[#1C1E26] border-b-2 border-[#F59E0B]">Process
                    Data</button>
                <button data-tab="inventory"
                    class="px-3 h-full flex items-center text-[12px] text-[#6B7280] border-b-2 border-transparent">Inventory</button>
                <button data-tab="timeline"
                    class="px-3 h-full flex items-center text-[12px] text-[#6B7280] border-b-2 border-transparent">Timeline</button>
                <button data-tab="summary"
                    class="px-3 h-full flex items-center text-[12px] text-[#6B7280] border-b-2 border-transparent">Summary</button>
            </div>
            <div class="flex items-center gap-3 text-xs text-[#9CA3AF]">
                <span class="mono hidden sm:inline" id="header-efficiency-metrics">Lead Time: 12.4 days · VA: 265s ·
                    0.02% efficiency</span>
                <div id="panel-toggle-icon" class="text-[#9CA3AF]"><svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg></div>
            </div>
        </div>

        <div id="table-scroll-container" class="flex-1 overflow-auto no-scrollbar">
            <table id="data-table-view" class="w-full border-collapse text-[12px]">
            </table>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>

</html>
